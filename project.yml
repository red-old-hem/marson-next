name: MarathonPlan
options:
  bundleIdPrefix: com.eiichi
  deploymentTarget:
    iOS: "17.0"
targets:
  MarathonPlan:
    type: application
    platform: iOS
    sources: [MarathonPlan]
    info:
      path: MarathonPlan/Info.plist
      properties:
        CFBundleDisplayName: マラソン逆算
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: ランニングのワークアウトを読み取り、走った日を自動でチェックインするために使用します
    entitlements:
      path: MarathonPlan/MarathonPlan.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: ja
        # ここに書かないと xcodegen generate のたびに
        # Xcode で選んだ Team が消え、実機ビルドが
        # 「requires a development team」で失敗する
        DEVELOPMENT_TEAM: V677493FKX
        CODE_SIGN_STYLE: Automatic
  MarathonPlanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MarathonPlanTests]
    dependencies:
      - target: MarathonPlan
    settings:
      base:
        # これが無いとテストバンドルの署名時に
        # 「does not have an Info.plist file」で失敗する
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: V677493FKX
        CODE_SIGN_STYLE: Automatic
